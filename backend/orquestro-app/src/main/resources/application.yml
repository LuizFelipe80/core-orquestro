spring:
  application:
    name: orquestro
  
  # Define qual perfil está ativo. 
  # Em sua máquina, 'dev' será o padrão. Em produção, você mudará para 'prod'.
  profiles:
    active: dev

  # Configurações comuns de JPA
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Configurações comuns de Flyway
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Configuração do Servidor
server:
  port: 8080
  servlet:
    context-path: /api

# OpenAPI permanece comum para facilitar testes em ambos os ambientes
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  paths-to-match: /auth/**, /users/**, /languages/**, /user-roles/**, /module-roles/**

# Management Endpoints Configuration (Actuator)
management:
  endpoints:
    web:
      exposure:
        # Em produção, expomos apenas o essencial para o health check
        include: health, info
  endpoint:
    health:
      show-details: when_authorized