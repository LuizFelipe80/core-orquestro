spring:
  application:
    name: orquestro
  
  datasource:
    url: jdbc:postgresql://localhost:5432/orquestro_db
    username: orquestro_admin
    password: orquestro_secure_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080
  servlet:
    context-path: /api