spring:
  application:
    name: orquestro
  
  # Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/orquestro_db
    username: postgres
    password: 12345
    driver-class-name: org.postgresql.Driver

  # Persistence Configuration
  jpa:
    hibernate:
      # We use 'validate' so Hibernate checks if the database matches our entities
      # without making any changes. Flyway handles the changes.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Database Versioning Configuration
  flyway:
    enabled: true
    # Allows Flyway to start on an existing database by creating a baseline
    baseline-on-migrate: true
    # Directory where our SQL migration scripts will be stored
    locations: classpath:db/migration

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /api

# Custom Application Security Settings
application:
  security:
    jwt:
      # Cryptographically secure secret key (HMAC-SHA256) in Base64
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      # Access Token Expiration: 86400000 ms = 24 hours
      expiration: 86400000
      # Refresh Token Expiration: 604800000 ms = 7 days
      refresh-token-expiration: 604800000

# Logging Configuration for easier debugging during development
logging:
  level:
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE